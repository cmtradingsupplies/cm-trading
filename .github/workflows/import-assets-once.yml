name: Import CM Trading website once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-assets-once.yml

permissions:
  contents: read

jobs:
  import:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Import approved public website
        run: python3 scripts/import_site.py
      - name: Commit verified website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Import verified CM Trading website and catalogs"
          git push origin HEAD:main
